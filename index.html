<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADS Show Calendar</title>
  <link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@100..900&display=swap" rel="stylesheet">
  
</head>
<body>
  <header>
    <h1>ADS Show Calendar</h1>
  </header>

  <main>
    <section class="upcoming">
      <h2>Upcoming Events</h2>
      <ul id="event-list">
        <li class="status">Loading events…</li>
      </ul>
    </section>

    <section class="calendar">
      <iframe id="calendar-frame" title="Google Calendar" frameborder="0" scrolling="no"></iframe>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
